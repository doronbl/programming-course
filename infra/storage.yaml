AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  programming-course storage stack (us-east-1): a private S3 content bucket
  named course-content-<stack-derived-suffix> that the FastAPI backend reads and
  writes. The SPA is now served by an ECS static-file service behind the ALB, so
  there is no SPA bucket and no CloudFront distribution here.

Parameters:
  ProjectName:
    Type: String
    Default: programming-course
    Description: Prefix used to name/tag resources.

Resources:
  ContentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Suffix is the unique GUID segment of the stack id, so the name is stable
      # for a given stack yet unique across deployments (repeatable, no hardcode).
      BucketName: !Sub
        - 'course-content-${Suffix}'
        - Suffix: !Select [2, !Split ['/', !Ref AWS::StackId]]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-content'

Outputs:
  ContentBucketName:
    Description: Name of the private S3 content bucket (backend CONTENT_BUCKET).
    Value: !Ref ContentBucket
    Export:
      Name: !Sub '${AWS::StackName}-ContentBucketName'
  ContentBucketArn:
    Description: ARN of the content bucket.
    Value: !GetAtt ContentBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ContentBucketArn'
